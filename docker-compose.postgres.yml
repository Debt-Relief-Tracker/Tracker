# Postgres overlay -- same app image, pointed at a Postgres service instead
# of the SQLite default (docs/architecture/0001-dual-database-adapter.md).
# Setting DATABASE_URL is what makes the app activate the Postgres repo;
# nothing else about the image changes.
#
#   cp .env.example .env   # fill in SECRET_KEY_BASE and POSTGRES_PASSWORD
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
services:
  app:
    environment:
      DATABASE_URL: "ecto://debt_relief_tracker:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/debt_relief_tracker"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: debt_relief_tracker
      POSTGRES_USER: debt_relief_tracker
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debt_relief_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
